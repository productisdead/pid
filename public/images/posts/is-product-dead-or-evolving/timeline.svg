<text x="175.0" y="420" text-anchor="middle" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" fill="#141112">P&amp;G "Brand Men"</text>
<text x="175.0" y="470" text-anchor="middle" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#6B6560">McElroy's memo: run</text>
<text x="175.0" y="506" text-anchor="middle" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#6B6560">each brand like its</text>
<text x="175.0" y="542" text-anchor="middle" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#6B6560">own startup</text>
<circle cx="487.5" cy="330" r="26" fill="#FED74F" stroke="#141112" stroke-width="5"/>
<text x="487.5" y="274" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="28" font-weight="700" fill="#141112">1940s–50s</text>
<text x="487.5" y="420" text-anchor="middle" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" fill="#141112">Toyota &amp; Kanban</text>
<text x="487.5" y="470" text-anchor="middle" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#6B6560">Lean, efficient</text>
<text x="487.5" y="506" text-anchor="middle" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#6B6560">delivery from the</text>
<text x="487.5" y="542" text-anchor="middle" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#6B6560">Japanese auto industry</text>
<circle cx="800.0" cy="330" r="26" fill="#FED74F" stroke="#141112" stroke-width="5"/>
<text x="800.0" y="274" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="28" font-weight="700" fill="#141112">2001</text>
<text x="800.0" y="420" text-anchor="middle" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" fill="#141112">Agile</text>
<text x="800.0" y="470" text-anchor="middle" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#6B6560">PMs move closer to</text>
<text x="800.0" y="506" text-anchor="middle" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#6B6560">R&amp;D: weekly priorities</text>
<text x="800.0" y="542" text-anchor="middle" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#6B6560">and decisions</text>
<circle cx="1112.5" cy="330" r="26" fill="#FED74F" stroke="#141112" stroke-width="5"/>
