<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 690" width="1600" height="690" role="img" aria-label="Timeline: 1931 P&amp;G Brand Men memo, 1940s–50s Toyota and Kanban, 2001 Agile, 2008–15 product books, 2020s AI everywhere.">
<rect width="1600" height="690" fill="#FAF8F3"/>
<text x="96" y="110" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="26" fill="#6B6560" letter-spacing="3">A VERY SHORT HISTORY OF PRODUCT</text>
<text x="96" y="180" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="800" fill="#141112" letter-spacing="-2">From brand men to AI copilots</text>
<line x1="135" y1="330" x2="1485" y2="330" stroke="#141112" stroke-width="6" stroke-linecap="round"/>
