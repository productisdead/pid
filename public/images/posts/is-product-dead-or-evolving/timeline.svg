<text x="1112.5" y="420" text-anchor="middle" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="700" fill="#141112">The "product bibles"</text>
<text x="1112.5" y="470" text-anchor="middle" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#6B6560">Inspired, The Lean</text>
<text x="1112.5" y="506" text-anchor="middle" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#6B6560">Product Playbook.</text>
