<text x="1425.0" y="542" text-anchor="middle" font-family="'Bricolage Grotesque', 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#6B6560">"Product is dead"?</text>
<text x="1455" y="630" text-anchor="end" font-family="'Indie Flower', 'Comic Sans MS', cursive" font-size="44" fill="#264653">next: evolving, not extinct →</text>
